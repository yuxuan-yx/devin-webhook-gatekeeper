<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devin Gatekeeper Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #151b25;
      --panel-2: #1c2430;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --border: #30363d;
      --subtle: #21262d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 0% 0%, #111827 0, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.45;
    }
    header {
      padding: 1.5rem 2rem;
      background: rgba(21, 27, 37, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand h1 { margin: 0; font-size: 1.3rem; letter-spacing: -0.02em; }
    .brand p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.8rem; }
    .live {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    main { padding: 1.75rem 2rem 3rem; max-width: 1600px; margin: 0 auto; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .kpi {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.1rem;
      position: relative;
      overflow: hidden;
    }
    .kpi::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--success));
      opacity: 0.6;
    }
    .kpi h3 { margin: 0 0 0.25rem; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi .big { font-size: 1.7rem; font-weight: 700; margin: 0; }
    .kpi .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .kpi.positive .big { color: var(--success); }
    .kpi.accent .big { color: var(--accent); }
    .kpi.warning .big { color: var(--warning); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .panel h2 { margin: 0 0 1rem; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tbody tr:hover { background: var(--panel-2); }
    td { color: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font-size: 0.75rem; color: var(--muted); }

    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.55rem; border-radius: 999px;
      font-size: 0.7rem; font-weight: 600;
    }
    .badge.accepted { background: rgba(63,185,80,0.12); color: var(--success); }
    .badge.dropped { background: rgba(210,153,34,0.12); color: var(--warning); }
    .badge.invalid { background: rgba(248,81,73,0.12); color: var(--danger); }
    .badge.inflight { background: rgba(88,166,255,0.12); color: var(--accent); }
    .badge.resolved { background: rgba(63,185,80,0.18); color: var(--success); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .link-col { display: flex; flex-direction: column; gap: 0.15rem; }
    .muted-link { color: var(--muted); }

    .stage-bar {
      display: flex; gap: 2px;
      height: 4px; width: 80px;
      border-radius: 2px; overflow: hidden;
      background: var(--subtle);
    }
    .stage-segment { flex: 1; background: var(--muted); }
    .stage-segment.on { background: var(--success); }

    @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { main { padding: 1rem; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } table { display: block; overflow-x: auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Devin Gatekeeper Dashboard</h1>
      <p>Autonomous triage control plane for engineering leaders</p>
    </div>
    <div class="live"><span class="dot"></span><span>Live</span></div>
  </header>

  <main>
    <section class="kpi-grid">
      <div class="kpi"><h3>Received</h3><p class="big" id="kpi-received">—</p></div>
      <div class="kpi accent"><h3>Accepted</h3><p class="big" id="kpi-accepted">—</p></div>
      <div class="kpi warning"><h3>Dropped</h3><p class="big" id="kpi-dropped">—</p></div>
      <div class="kpi positive"><h3>Resolved w/ PR</h3><p class="big" id="kpi-resolved">—</p></div>
      <div class="kpi positive"><h3>Hours Saved</h3><p class="big" id="kpi-hours-saved">—</p><p class="sub">est. human time</p></div>
      <div class="kpi"><h3>Budget</h3><p class="big" id="kpi-budget">—</p><p class="sub">today</p></div>
    </section>

    <section class="panel">
      <h2>Audit Trail — Recent Deliveries</h2>
      <table>
        <thead>
          <tr>
            <th>Delivery</th>
            <th>Trigger</th>
            <th>Repository</th>
            <th>Timeline</th>
            <th>Status</th>
            <th>Session / PR</th>
            <th>Impact</th>
          </tr>
        </thead>
        <tbody id="deliveries"></tbody>
      </table>
    </section>
  </main>

  <script>
  const $ = id => document.getElementById(id);
  const fmt = n => typeof n === 'number' ? n.toLocaleString() : n;

  function relativeTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function stageSegments(stages) {
    const names = ['received','verified','decided','dispatched'];
    const present = new Set((stages || []).map(s => s.stage));
    return `<div class="stage-bar" title="${names.map(n => present.has(n) ? n : 'pending').join(' → ')}">` +
      names.map(n => `<div class="stage-segment ${present.has(n)?'on':''}"></div>`).join('') +
      '</div>';
  }

  async function load() {
    try {
      const [stats, metrics, deliveries] = await Promise.all([
        fetch('/stats').then(r => r.json()),
        fetch('/metrics').then(r => r.json()),
        fetch('/deliveries').then(r => r.json()),
      ]);

      $('kpi-received').textContent = fmt(stats.counters?.received ?? 0);
      $('kpi-accepted').textContent = fmt(stats.counters?.accepted ?? 0);
      $('kpi-dropped').textContent = fmt(stats.dropped_total ?? 0);
      $('kpi-resolved').textContent = fmt(metrics.sessions_resolved ?? 0);
      $('kpi-hours-saved').textContent = (metrics.total_hours_saved ?? 0).toFixed(2);
      $('kpi-budget').textContent = `${stats.budget?.sessions_today ?? 0}/${stats.budget?.max_daily_sessions ?? 0}`;

      const tbody = $('deliveries');
      tbody.innerHTML = '';
      deliveries.slice(-30).reverse().forEach(d => {
        const statusClass = d.decision === 'accepted' ? (d.pull_request_url ? 'resolved' : (d.status === 'failed' ? 'invalid' : 'inflight')) : (d.decision === 'dropped' ? 'dropped' : 'invalid');
        const statusText = d.pull_request_url ? 'PR Ready' : (d.status ? d.status : (d.decision || 'dropped'));

        const sourceLink = d.source_url
          ? `<a href="${d.source_url}" target="_blank" title="Open GitHub issue/run">${d.event}</a>`
          : d.event;

        const sessionCell = d.session_url
          ? `<a href="${d.session_url}" target="_blank" class="mono">${(d.session_id||'').slice(0,10)}</a>`
          : '—';
        const prCell = d.pull_request_url
          ? `<a href="${d.pull_request_url}" target="_blank" class="muted-link">PR</a>`
          : '';

        const refreshBtn = d.session_id
          ? `<button class="small" style="margin-top:0.25rem;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:0.3rem;cursor:pointer" onclick="refreshDelivery('${d.delivery_id}', this)">refresh</button>`
          : '';

        const humanHours = (d.category && typeof metrics.category_estimates !== 'undefined' ? metrics.category_estimates[d.category] : '') || '';
        const impactCell = d.decision === 'accepted'
          ? `<span title="Estimated human-hours if done manually">${humanHours}h saved (est)</span>`
          : `<span class="small">${d.reason}</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <span class="mono">${(d.delivery_id||'').slice(0,8)}</span>
            <div class="small" style="margin-top:0.15rem">${relativeTime(d.received_at)}</div>
          </td>
          <td>
            <div class="link-col">${sourceLink}</div>
            ${d.category ? `<span class="badge ${d.decision==='accepted'?'accepted':'dropped'}">${d.category}</span>` : ''}
          </td>
          <td>${d.repository || '—'}</td>
          <td>${stageSegments(d.stages)}</td>
          <td><span class="badge ${statusClass}">${statusText}</span></td>
          <td>
            <div class="link-col">${sessionCell}${prCell}${refreshBtn}</div>
          </td>
          <td>${impactCell}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (e) {
      console.error('dashboard load failed', e);
    }
  }

  window.refreshDelivery = async function(id, btn) {
    btn.textContent = '...';
    try {
      const r = await fetch(`/deliveries/${id}/refresh`, { method: 'POST' });
      if (!r.ok) throw new Error(r.status);
      await load();
    } catch (e) {
      btn.textContent = 'err';
      console.error(e);
    }
  };

  load();
  setInterval(load, 3000);
  </script>
</body>
</html>
