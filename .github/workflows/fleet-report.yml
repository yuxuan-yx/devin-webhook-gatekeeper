# Scheduled observability: the answer to "how would I know this is working?"
#
# Runs independently of any trigger, so the numbers are available whether or not
# anything fired today. Output lands on the run summary page, which is a URL a
# VP can bookmark without needing access to a log aggregator.

name: Devin Fleet Report

on:
  schedule:
    - cron: "0 13 * * 1-5" # weekday mornings, US-centric
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --quiet -r requirements-dispatch.txt

      - name: Render fleet report
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
        run: python report.py
